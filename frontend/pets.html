<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetPass | Pets</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="topnav">
    <a href="dashboard.html">Dashboard</a>
    <a href="/pets">Pets</a>
    <a href="vaccinations.html">Vaccinations</a>
    <a href="medical-history.html">Medical Records</a>
    <a href="qr.html">QR Code</a>
  </nav>

  <main class="app-shell stack">
    <header class="hero space-between">
      <div class="stack" style="gap: 10px;">
        <div class="badge">VetPass Pets</div>
        <div>
          <h1 class="page-title" style="margin-top: 14px;">Pets overview</h1>
          <p class="muted" id="petsSubtitle">Loading pets...</p>
        </div>
      </div>

      <div class="row">
        <a class="btn btn-secondary" href="dashboard.html">Back to dashboard</a>
        <button class="btn btn-primary" id="refreshButton" type="button">Refresh</button>
      </div>
    </header>

    <section class="grid cols-2">
      <article class="panel stack">
        <div class="space-between">
          <h2 style="margin: 0;">Your pets</h2>
          <span class="badge" id="petCount">0 pets</span>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Species</th>
                <th>Breed</th>
                <th>Gender</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="petsTableBody">
              <tr>
                <td colspan="5" class="muted">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </article>

      <article class="panel stack">
        <div class="space-between">
          <h2 style="margin: 0;" id="formTitle">Add pet</h2>
          <span class="muted">Manage your records</span>
        </div>

        <form id="petForm" class="stack">
          <input type="hidden" id="petId">

          <div class="field">
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Milo" required>
          </div>

          <div class="field">
            <label for="species">Species</label>
            <input id="species" type="text" placeholder="Dog" required>
          </div>

          <div class="field">
            <label for="breed">Breed</label>
            <input id="breed" type="text" placeholder="Labrador Retriever">
          </div>

          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender">
              <option value="unknown">Unknown</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>

          <div class="field">
            <label for="birth_date">Birth date</label>
            <input id="birth_date" type="date">
          </div>

          <div class="field">
            <label for="microchip_number">Microchip number</label>
            <input id="microchip_number" type="text" placeholder="MC-VE-0001">
          </div>

          <div class="field">
            <label for="notes">Notes</label>
            <textarea id="notes" rows="4" placeholder="Special care notes..."></textarea>
          </div>

          <div class="row">
            <button class="btn btn-primary" type="submit" id="submitButton">Save pet</button>
            <button class="btn btn-secondary" type="button" id="cancelEditButton" hidden>Cancel edit</button>
          </div>

          <p id="petMessage" class="alert" hidden></p>
        </form>
      </article>
    </section>
  </main>

  <script src="js/pets.js"></script>
</body>
</html>
