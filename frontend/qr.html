<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetPass | QR Code</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="topnav">
    <a href="dashboard.html">Dashboard</a>
    <a href="/pets">Pets</a>
    <a href="vaccinations.html">Vaccinations</a>
    <a href="medical-history.html">Medical Records</a>
    <a href="qr.html">QR Code</a>
  </nav>

  <main class="app-shell stack">
    <header class="hero space-between">
      <div>
        <div class="badge">QR Code</div>
        <h1 class="page-title" style="margin-top: 14px;">Pet ID QR</h1>
        <p class="muted">Share a scannable profile card for quick identification.</p>
      </div>

      <div class="row">
        <a class="btn btn-secondary" href="dashboard.html">Back to dashboard</a>
        <a class="btn btn-primary" href="#download">Download QR</a>
      </div>
    </header>

    <section class="grid cols-2">
      <article class="panel stack">
        <div class="space-between">
          <h2 style="margin: 0;">QR preview</h2>
          <span class="badge">Milo</span>
        </div>

        <div style="display:flex; justify-content:center; align-items:center; min-height: 320px; border: 2px dashed rgba(31, 42, 46, 0.14); border-radius: 22px; background: rgba(255, 255, 255, 0.72);">
          <div style="width: 220px; height: 220px; border-radius: 20px; background: conic-gradient(from 45deg, #1f6f5b 0 25%, #ffffff 0 50%, #1f6f5b 0 75%, #ffffff 0); box-shadow: inset 0 0 0 18px #ffffff, 0 14px 26px rgba(31, 42, 46, 0.14);"></div>
        </div>
      </article>

      <article class="panel stack">
        <div class="space-between">
          <h2 style="margin: 0;">QR details</h2>
          <span class="badge">Ready</span>
        </div>

        <div class="card stack">
          <span class="muted">Owner</span>
          <strong>VetPass Demo User</strong>
        </div>
        <div class="card stack">
          <span class="muted">Pet</span>
          <strong>Milo</strong>
        </div>
        <div class="card stack">
          <span class="muted">Microchip</span>
          <strong>MC-VE-0001</strong>
        </div>

        <div class="row" id="download">
          <button class="btn btn-primary" type="button">Download image</button>
          <button class="btn btn-secondary" type="button">Copy link</button>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
